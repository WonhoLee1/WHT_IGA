<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img"
     aria-labelledby="title description">
  <title id="title">NAFEMS P18 T4 geometry and thermal boundary conditions</title>
  <desc id="description">A 0.6 metre by 1 metre plate held at one hundred degrees Celsius along its bottom edge, insulated on the left, and exposed to convection along the top and right edges. Probe E is 0.2 metre above the lower-right corner.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30475c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c44b40"/>
    </marker>
    <style>
      .body { fill: #e8f0f5; stroke: #20384d; stroke-width: 6; }
      .label { fill: #20384d; font: 29px Arial, Helvetica, sans-serif; }
      .thermal { fill: #b63f34; font: 28px Arial, Helvetica, sans-serif; }
      .cold { fill: #2f7399; font: 28px Arial, Helvetica, sans-serif; }
      .dimension { fill: none; stroke: #30475c; stroke-width: 3; marker-start: url(#arrow-dark); marker-end: url(#arrow-dark); }
      .flux { fill: none; stroke: #c44b40; stroke-width: 5; marker-end: url(#arrow-red); }
    </style>
  </defs>

  <rect class="body" x="250" y="70" width="400" height="570"/>
  <line x1="250" y1="640" x2="650" y2="640" stroke="#c44b40" stroke-width="10"/>
  <text class="thermal" x="450" y="625" text-anchor="middle">100 °C</text>

  <text class="label" x="225" y="55">D</text>
  <text class="label" x="665" y="55">C</text>
  <text class="label" x="225" y="680">A</text>
  <text class="label" x="650" y="680">B</text>

  <line class="flux" x1="305" y1="65" x2="305" y2="20"/>
  <line class="flux" x1="450" y1="65" x2="450" y2="20"/>
  <line class="flux" x1="595" y1="65" x2="595" y2="20"/>
  <line class="flux" x1="655" y1="165" x2="720" y2="165"/>
  <line class="flux" x1="655" y1="330" x2="720" y2="330"/>
  <line class="flux" x1="655" y1="495" x2="720" y2="495"/>
  <text class="label" x="735" y="285">h = 750 W/(m² K)</text>
  <text class="label" x="735" y="325">T∞ = 0 °C</text>

  <text class="cold" x="120" y="365" text-anchor="middle" transform="rotate(-90 120 365)">insulated</text>
  <line class="dimension" x1="190" y1="75" x2="190" y2="635"/>
  <text class="label" x="155" y="360" text-anchor="middle" transform="rotate(-90 155 360)">1.0 m</text>

  <line class="dimension" x1="255" y1="725" x2="645" y2="725"/>
  <text class="label" x="450" y="770" text-anchor="middle">0.6 m</text>

  <circle cx="650" cy="526" r="10" fill="#b63f34"/>
  <text class="label" x="615" y="515">E</text>
  <line class="dimension" x1="700" y1="635" x2="700" y2="526"/>
  <text class="label" x="720" y="590">0.2 m</text>
</svg>
