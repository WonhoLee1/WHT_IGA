         d="M 0,0 10,5 0,10 2.5,5 Z"
         fill="#27272a"
         id="path1" />
    </marker>
    <marker
       id="leader-arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="3.2"
       markerHeight="3.2"
       orient="auto">
      <path
         d="M 0,0 10,5 0,10 2.5,5 Z"
         fill="#27272a"
         id="path2" />
    </marker>
    <marker
       id="dimension-stop"
       viewBox="-1 -5 2 10"
       refX="0"
       refY="0"
       markerWidth="2.4"
       markerHeight="2.4"
       markerUnits="userSpaceOnUse"
       orient="auto"
       overflow="visible">
      <path
         d="M 0,-4 V 4"
         fill="none"
         stroke="#27272a"
         stroke-width="1"
         id="path3" />
    </marker>
    <linearGradient
