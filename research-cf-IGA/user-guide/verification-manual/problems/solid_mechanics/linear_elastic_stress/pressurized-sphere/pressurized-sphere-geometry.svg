       y1="40.028925"
       x2="99.812494"
       y2="115.17728"
       gradientTransform="matrix(1.2691728,0,0,0.80295235,-2.3821264,0.00643918)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#a753f5"
         stop-opacity="0.42"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#4380f3"
         stop-opacity="0.30"
         id="stop4" />
    </linearGradient>
    <style
       id="style4">&#10;      .outer-surface { fill: url(#shell-gradient); stroke: #27272a; stroke-width: 0.48; }&#10;      .cut-left { fill: #a753f5; fill-opacity: 0.30; stroke: #27272a; stroke-width: 0.38; }&#10;      .cut-right { fill: #4380f3; fill-opacity: 0.34; stroke: #27272a; stroke-width: 0.38; }&#10;      .cut-bottom { fill: #f04562; fill-opacity: 0.14; stroke: #27272a; stroke-width: 0.38; }&#10;      .inner-edge { fill: none; stroke: #27272a; stroke-width: 0.38; }&#10;      .hidden { fill: none; stroke: #71717a; stroke-width: 0.3; stroke-dasharray: 1.4 1.2; }&#10;      .axis { fill: none; stroke: #27272a; stroke-width: 0.38; marker-end: url(#axis-arrow); }&#10;      .dimension { fill: none; stroke: #27272a; stroke-width: 0.3; marker-start: url(#dimension-stop); marker-end: url(#dimension-stop); }&#10;      .leader { fill: none; stroke: #27272a; stroke-width: 0.28; marker-end: url(#leader-arrow); }&#10;      .math { fill: #27272a; font-family: &quot;CMU Serif&quot;, serif; font-size: 4px; font-style: italic; }&#10;      .label { fill: #27272a; font-family: &quot;CMU Serif&quot;, serif; font-size: 3.2px; }&#10;      .plane-label { fill: #27272a; font-family: &quot;CMU Serif&quot;, serif; font-size: 3.4px; font-style: italic; }&#10;    </style>
