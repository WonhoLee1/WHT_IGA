  <title
     id="title1">Thick-walled spherical shell octant geometry</title>
  <desc
     id="desc1">Axonometric view of a spherical shell octant above its center, with positive x, y, and z axes radiating away from the viewer, inner radius a, outer radius b, and coordinate-plane cut faces.</desc>
