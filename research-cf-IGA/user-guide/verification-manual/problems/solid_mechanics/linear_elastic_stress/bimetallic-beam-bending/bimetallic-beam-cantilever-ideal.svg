<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="150mm" height="20mm" viewBox="0 0 150 20" version="1.1"
     id="bimetallic-beam-cantilever-ideal" xmlns="http://www.w3.org/2000/svg">
  <title>Idealized clamped bimetallic cantilever beam</title>
  <desc>A two-layer beam with all translations and rotations fixed at its left end.</desc>
  <defs>
    <pattern id="clamp-hatch" width="0.9" height="0.9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="0.9" stroke="#f04562" stroke-width="0.19" />
    </pattern>
    <style>
      .stiff { fill: #a753f5; fill-opacity: 0.25; }
      .flexible { fill: #4380f3; fill-opacity: 0.25; }
      .outline { fill: none; stroke: #27272a; stroke-width: 0.4; }
      .interface { stroke: #f04562; stroke-width: 0.5; }
      .constraint { fill: #27272a; font-family: "CMU Serif", serif; font-size: 3.1px; }
    </style>
  </defs>
  <rect width="150" height="20" fill="#ffffff" />
  <rect class="stiff" x="32" y="4" width="112" height="6" />
  <rect class="flexible" x="32" y="10" width="112" height="6" />
  <rect class="outline" x="32" y="4" width="112" height="12" />
  <line class="interface" x1="32" y1="10" x2="144" y2="10" />
  <rect x="27" y="4" width="5" height="12" fill="url(#clamp-hatch)" />
  <line x1="32" y1="4" x2="32" y2="16" stroke="#f04562" stroke-width="0.8" />
  <text class="constraint" x="0.7" y="7.2"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="2.1">x</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="0.7" y="11.1"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="2.1">y</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="0.7" y="15"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="2.1">z</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="13.2" y="7.2"><tspan font-style="italic">θ</tspan><tspan baseline-shift="sub" font-size="2.1">x</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="13.2" y="11.1"><tspan font-style="italic">θ</tspan><tspan baseline-shift="sub" font-size="2.1">y</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="13.2" y="15"><tspan font-style="italic">θ</tspan><tspan baseline-shift="sub" font-size="2.1">z</tspan><tspan> = 0</tspan></text>
</svg>
