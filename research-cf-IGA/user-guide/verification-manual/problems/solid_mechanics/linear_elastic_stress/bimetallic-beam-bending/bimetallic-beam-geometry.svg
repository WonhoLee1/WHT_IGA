  <desc
     id="description">Side and cross-section views of a two-layer beam. The stiff layer lies above the interface at y equals zero, and the flexible layer lies below it. Dimensions show length L, width b, stiff-layer height h subscript s, and flexible-layer height h subscript f.</desc>
