<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="150mm" height="34mm" viewBox="0 0 150 34" version="1.1"
     id="bimetallic-beam-load-body-force" xmlns="http://www.w3.org/2000/svg">
  <title>Body-force loading on a bimetallic cantilever beam</title>
  <desc>Layer-specific downward body forces act with magnitude rho times g in each material.</desc>
  <defs>
    <marker id="load-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="2.2" markerHeight="2.2" orient="auto">
      <path d="M 0,0 10,5 0,10 2.5,5 Z" fill="#27272a" />
    </marker>
    <pattern id="body-arrows" x="22" y="17" width="6" height="6" patternUnits="userSpaceOnUse" viewBox="0 0 6 6">
      <line x1="1.5" y1="0.35" x2="1.5" y2="2.1" stroke="#27272a" stroke-width="0.22" marker-end="url(#load-arrow)" />
      <line x1="4.5" y1="1.85" x2="4.5" y2="3.6" stroke="#27272a" stroke-width="0.22" marker-end="url(#load-arrow)" />
      <line x1="1.5" y1="3.35" x2="1.5" y2="5.1" stroke="#27272a" stroke-width="0.22" marker-end="url(#load-arrow)" />
    </pattern>
    <pattern id="clamp-hatch" width="0.9" height="0.9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="0.9" stroke="#f04562" stroke-width="0.19" />
    </pattern>
    <style>
      .stiff { fill: #a753f5; fill-opacity: 0.25; }
      .flexible { fill: #4380f3; fill-opacity: 0.25; }
      .outline { fill: none; stroke: #27272a; stroke-width: 0.4; }
      .interface { stroke: #f04562; stroke-width: 0.5; }
      .math { fill: #27272a; stroke: #ffffff; stroke-width: 0.55; paint-order: stroke; font-family: "CMU Serif", serif; font-size: 3.5px; font-style: italic; }
      .constraint { fill: #27272a; font-family: "CMU Serif", serif; font-size: 2.7px; }
    </style>
  </defs>
  <rect width="150" height="34" fill="#ffffff" />
  <rect class="stiff" x="22" y="17" width="112" height="6" />
  <rect class="flexible" x="22" y="23" width="112" height="6" />
  <rect x="22" y="17" width="112" height="12" fill="url(#body-arrows)" />
  <rect class="outline" x="22" y="17" width="112" height="12" />
  <line class="interface" x1="22" y1="23" x2="134" y2="23" />
  <rect x="17" y="17" width="5" height="12" fill="url(#clamp-hatch)" />
  <line x1="22" y1="17" x2="22" y2="29" stroke="#f04562" stroke-width="0.8" />
  <text class="constraint" x="1" y="20.5"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">x</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="1" y="24"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">y</tspan><tspan> = 0</tspan></text>
  <text class="constraint" x="1" y="27.5"><tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">z</tspan><tspan> = 0</tspan></text>
  <text class="math" x="122" y="21.4" text-anchor="middle"><tspan>q</tspan><tspan baseline-shift="sub" font-size="2.4">s</tspan><tspan> = ρ</tspan><tspan baseline-shift="sub" font-size="2.4">s</tspan><tspan baseline-shift="baseline">g</tspan></text>
  <text class="math" x="122" y="27.4" text-anchor="middle"><tspan>q</tspan><tspan baseline-shift="sub" font-size="2.4">f</tspan><tspan> = ρ</tspan><tspan baseline-shift="sub" font-size="2.4">f</tspan><tspan baseline-shift="baseline">g</tspan></text>
</svg>
