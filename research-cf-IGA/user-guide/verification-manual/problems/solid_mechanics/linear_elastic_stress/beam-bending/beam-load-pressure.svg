<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="127mm"
   height="26mm"
   viewBox="17.5 3 127 26"
   version="1.1"
   id="beam-uniform-pressure"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">Cantilever beam with uniform pressure on the top edge</title>
  <desc id="description">A cantilever beam clamped at the left edge with a uniformly distributed downward pressure labeled w along the top edge.</desc>
  <defs>
    <marker
       id="load-arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="4.5"
       markerHeight="4.5"
       orient="auto">
      <path
         d="M 0,0 L 10,5 L 0,10 L 2.5,5 Z"
         fill="#27272a" />
    </marker>
    <pattern
       id="clamp-hatch"
       width="0.9"
       height="0.9"
       patternUnits="userSpaceOnUse"
       patternTransform="rotate(45)">
      <line
         x1="0"
         y1="0"
         x2="0"
         y2="0.9"
         stroke="#f04562"
         stroke-width="0.19" />
    </pattern>
    <style>
      .beam {
        fill: #4380f3;
        fill-opacity: 0.18;
        stroke: #27272a;
        stroke-width: 0.4;
      }
      .load {
        fill: none;
        stroke: #27272a;
        stroke-width: 0.4;
        marker-end: url(#load-arrow);
      }
      .math-label {
        fill: #27272a;
        font-family: "CMU Serif", serif;
        font-size: 4.2px;
        font-style: italic;
      }
      .constraint-label {
        fill: #27272a;
        font-family: "CMU Serif", serif;
        font-size: 2.7px;
      }
    </style>
  </defs>
  <rect
     x="17.5"
     y="3"
     width="127"
     height="26"
     fill="#ffffff"
     id="background" />
  <g id="beam-and-boundary-condition">
    <rect
       class="beam"
       x="32"
       y="17"
       width="112"
       height="10.97"
       id="beam" />
    <rect
       x="27"
       y="17"
       width="5"
       height="10.97"
       fill="url(#clamp-hatch)"
       id="clamp-support" />
    <line
       x1="32"
       y1="17"
       x2="32"
       y2="27.97"
       stroke="#f04562"
       stroke-width="0.8"
       id="clamped-edge" />
    <text class="constraint-label" x="18" y="19.8" id="constraint-x">
      <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">x</tspan><tspan baseline-shift="baseline"> = 0</tspan>
    </text>
    <text class="constraint-label" x="18" y="22.5" id="constraint-y">
      <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">y</tspan><tspan baseline-shift="baseline"> = 0</tspan>
    </text>
    <text class="constraint-label" x="18" y="25.2" id="constraint-z">
      <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">z</tspan><tspan baseline-shift="baseline"> = 0</tspan>
    </text>
  </g>
  <g id="uniform-pressure" aria-label="Uniform pressure w">
    <line class="load" x1="36" y1="8.5" x2="36" y2="16.1" />
    <line class="load" x1="45.45" y1="8.5" x2="45.45" y2="16.1" />
    <line class="load" x1="54.91" y1="8.5" x2="54.91" y2="16.1" />
    <line class="load" x1="64.36" y1="8.5" x2="64.36" y2="16.1" />
    <line class="load" x1="73.82" y1="8.5" x2="73.82" y2="16.1" />
    <line class="load" x1="83.27" y1="8.5" x2="83.27" y2="16.1" />
    <line class="load" x1="92.73" y1="8.5" x2="92.73" y2="16.1" />
    <line class="load" x1="102.18" y1="8.5" x2="102.18" y2="16.1" />
    <line class="load" x1="111.64" y1="8.5" x2="111.64" y2="16.1" />
    <line class="load" x1="121.09" y1="8.5" x2="121.09" y2="16.1" />
    <line class="load" x1="130.55" y1="8.5" x2="130.55" y2="16.1" />
    <line class="load" x1="140" y1="8.5" x2="140" y2="16.1" />
    <text
       class="math-label"
       x="88"
       y="5.5"
       text-anchor="middle"
       id="pressure-label">w</text>
  </g>
</svg>
