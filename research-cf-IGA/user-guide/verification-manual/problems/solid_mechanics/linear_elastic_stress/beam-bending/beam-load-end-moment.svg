<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="142mm"
   height="24mm"
   viewBox="17.5 7 142 24"
   version="1.1"
   id="beam-end-moment"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title id="title">Cantilever beam with a concentrated end moment</title>
  <desc id="description">A cantilever beam clamped at the left edge with a clockwise concentrated moment labeled M subscript 0 at the free end.</desc>
  <defs>
    <marker
       id="moment-arrow"
       viewBox="0 0 10 10"
       refX="10"
       refY="5"
       markerWidth="5"
       markerHeight="5"
       orient="auto">
      <path
         d="M 0,0 L 10,5 L 0,10 L 2.5,5 Z"
         fill="#27272a" />
    </marker>
    <pattern
       id="clamp-hatch"
       width="0.9"
       height="0.9"
       patternUnits="userSpaceOnUse"
       patternTransform="rotate(45)">
      <line
         x1="0"
         y1="0"
         x2="0"
         y2="0.9"
         stroke="#f04562"
         stroke-width="0.19" />
    </pattern>
    <style>
      .beam {
        fill: #4380f3;
        fill-opacity: 0.18;
        stroke: #27272a;
        stroke-width: 0.4;
      }
      .moment {
        fill: none;
        stroke: #27272a;
        stroke-width: 0.55;
        marker-end: url(#moment-arrow);
      }
      .math-label {
        fill: #27272a;
        font-family: "CMU Serif", serif;
        font-size: 4.2px;
        font-style: italic;
      }
      .constraint-label {
        fill: #27272a;
        font-family: "CMU Serif", serif;
        font-size: 2.7px;
      }
    </style>
  </defs>
  <rect
     x="17.5"
     y="7"
     width="142"
     height="24"
     fill="#ffffff"
     id="background" />
  <g id="beam-and-boundary-condition">
    <rect
       class="beam"
       x="32"
       y="17"
       width="112"
       height="10.97"
       id="beam" />
    <rect
       x="27"
       y="17"
       width="5"
       height="10.97"
       fill="url(#clamp-hatch)"
       id="clamp-support" />
    <line
       x1="32"
       y1="17"
       x2="32"
       y2="27.97"
       stroke="#f04562"
       stroke-width="0.8"
       id="clamped-edge" />
    <text class="constraint-label" x="18" y="19.8" id="constraint-x">
      <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">x</tspan><tspan baseline-shift="baseline"> = 0</tspan>
    </text>
    <text class="constraint-label" x="18" y="22.5" id="constraint-y">
      <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">y</tspan><tspan baseline-shift="baseline"> = 0</tspan>
    </text>
    <text class="constraint-label" x="18" y="25.2" id="constraint-z">
      <tspan font-style="italic">u</tspan><tspan baseline-shift="sub" font-size="1.9">z</tspan><tspan baseline-shift="baseline"> = 0</tspan>
    </text>
  </g>
  <g id="end-moment" aria-label="Concentrated end moment M 0">
    <path
       class="moment"
       d="M 151.5,16 A 7,7 0 0 1 151.5,30"
       id="end-moment-arrow" />
    <text
       class="math-label"
       x="151.5"
       y="10.8"
       text-anchor="middle"
       id="end-moment-label"><tspan>M</tspan><tspan baseline-shift="sub" font-size="2.9">0</tspan></text>
  </g>
</svg>
