<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img"
     aria-labelledby="title description">
  <title id="title">NAFEMS P18 T1 quarter-symmetry model</title>
  <desc id="description">A ten millimetre square quarter plate with symmetry conditions on its left and bottom edges and a one millimetre radius thermal-strain hot spot at the origin.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30475c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7"
            orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c44b40"/>
    </marker>
    <pattern id="hot-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#c44b40" stroke-width="5"/>
    </pattern>
    <style>
      .body { fill: #e8f0f5; stroke: #20384d; stroke-width: 6; }
      .label { fill: #20384d; font: 30px Arial, Helvetica, sans-serif; }
      .small { fill: #20384d; font: 25px Arial, Helvetica, sans-serif; }
      .boundary { fill: #2f7399; font: 25px Arial, Helvetica, sans-serif; }
      .hot { fill: #b63f34; font: 25px Arial, Helvetica, sans-serif; }
      .dimension { fill: none; stroke: #30475c; stroke-width: 3; marker-start: url(#arrow-dark); marker-end: url(#arrow-dark); }
    </style>
  </defs>

  <rect class="body" x="230" y="55" width="600" height="600"/>
  <path d="M 230 655 L 305 655 A 75 75 0 0 0 230 580 Z" fill="url(#hot-hatch)" stroke="#c44b40" stroke-width="5"/>

  <text class="label" x="525" y="350" text-anchor="middle">zero thermal strain</text>
  <text class="hot" x="345" y="525">hot spot:</text>
  <text class="hot" x="345" y="560">thermal strain 10⁻³</text>
  <line x1="335" y1="570" x2="272" y2="615" stroke="#c44b40" stroke-width="4" marker-end="url(#arrow-red)"/>
  <text class="small" x="238" y="595">r = 1 mm</text>
  <circle cx="290" cy="655" r="9" fill="#b63f34"/>
  <text class="label" x="305" y="642">D</text>
  <text class="label" x="195" y="698">O</text>

  <line class="dimension" x1="185" y1="60" x2="185" y2="650"/>
  <text class="label" x="120" y="365" text-anchor="middle" transform="rotate(-90 120 365)">10 mm</text>
  <text class="boundary" x="44" y="360" text-anchor="middle" transform="rotate(-90 44 360)">x = 0: uₓ = 0</text>

  <line class="dimension" x1="235" y1="715" x2="825" y2="715"/>
  <text class="label" x="530" y="753" text-anchor="middle">10 mm</text>
  <text class="boundary" x="530" y="695" text-anchor="middle">y = 0: uᵧ = 0</text>
</svg>
