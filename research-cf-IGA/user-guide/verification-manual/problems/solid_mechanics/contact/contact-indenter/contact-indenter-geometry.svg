  <title
     id="title">Contact-indenter geometry and initial position</title>
  <desc
     id="desc">Axonometric sketch of a hollow lower-hemispherical indenter above a rectangular block. The block dimensions are five inches in x, two inches in y, and three inches in z. The indenter begins above the left side of the block with a small initial clearance. A section inset identifies its outer and inner radii and the flat cut through the sphere center.</desc>
  <defs
     id="defs9">
    <linearGradient
       id="block-top-gradient"
       x1="18"
       y1="55"
       x2="121"
       y2="42"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#a753f5"
         stop-opacity="0.22"
         id="stop1" />
      <stop
         offset="1"
         stop-color="#4380f3"
         stop-opacity="0.30"
         id="stop2" />
    </linearGradient>
    <linearGradient
       id="block-front-gradient"
       x1="18"
       y1="55"
       x2="103"
       y2="86"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#4380f3"
         stop-opacity="0.20"
         id="stop3" />
      <stop
         offset="1"
         stop-color="#4380f3"
         stop-opacity="0.34"
         id="stop4" />
    </linearGradient>
    <radialGradient
       id="indenter-gradient"
       cx="35%"
       cy="28%"
       r="72%">
      <stop
         offset="0"
         stop-color="#ffffff"
         id="stop5" />
      <stop
         offset="0.28"
         stop-color="#cda8f7"
         stop-opacity="0.72"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#8d5bd1"
         stop-opacity="0.88"
         id="stop7" />
    </radialGradient>
    <marker
       id="axis-arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="4"
       markerHeight="4"
       orient="auto">
      <path
         d="M 0,0 10,5 0,10 2.5,5 Z"
         fill="#27272a"
         id="path7" />
    </marker>
    <marker
       id="leader-arrow"
       viewBox="0 0 10 10"
       refX="8"
       refY="5"
       markerWidth="3.2"
       markerHeight="3.2"
       orient="auto">
      <path
         d="M 0,0 10,5 0,10 2.5,5 Z"
