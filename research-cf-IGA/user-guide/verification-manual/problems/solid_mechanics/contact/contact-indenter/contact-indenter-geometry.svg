    </marker>
    <style
       id="style9">&#10;      .outline { stroke: #27272a; stroke-width: 0.48; stroke-linejoin: round; }&#10;      .hidden { fill: none; stroke: #71717a; stroke-width: 0.32; stroke-dasharray: 1.6 1.3; }&#10;      .centerline { fill: none; stroke: #71717a; stroke-width: 0.28; stroke-dasharray: 1.2 1.2; }&#10;      .axis { fill: none; stroke: #27272a; stroke-width: 0.38; marker-end: url(#axis-arrow); }&#10;      .dimension { fill: none; stroke: #27272a; stroke-width: 0.3; marker-start: url(#dimension-stop); marker-end: url(#dimension-stop); }&#10;      .extension { fill: none; stroke: #71717a; stroke-width: 0.24; }&#10;      .leader { fill: none; stroke: #27272a; stroke-width: 0.28; marker-end: url(#leader-arrow); }&#10;      .math { fill: #27272a; font-family: &quot;CMU Serif&quot;, serif; font-size: 4px; font-style: italic; }&#10;      .label { fill: #27272a; font-family: &quot;CMU Serif&quot;, serif; font-size: 3.4px; }&#10;      .small-label { fill: #27272a; font-family: &quot;CMU Serif&quot;, serif; font-size: 3px; }&#10;    </style>
